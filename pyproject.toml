[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "req(*ids): requirement / acceptance-criteria IDs verified by the test, e.g. req('FR-003', 'AC-002')",
    "ui: Streamlit AppTest smoke tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Architecture section 8 rule set.
select = ["E", "F", "I", "B", "UP", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S608", "S105", "S106"]
